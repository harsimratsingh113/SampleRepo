name: Collect Snyk Context

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'JSON array of runner labels, for example ["ubuntu-latest"] or ["self-hosted","macOS","X64","codex-jira-runner"].'
        required: false
        default: '["ubuntu-latest"]'
        type: string
      context_dir:
        description: "Directory where the markdown context file should be written."
        required: false
        default: codex-context
        type: string
      artifact_name:
        description: "Artifact name used by the master Codex workflow."
        required: false
        default: codex-context-snyk
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect Snyk vulnerability context
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_SCAN_PATH: ${{ vars.SNYK_SCAN_PATH || '.' }}
          SNYK_SCAN_MODE: ${{ vars.SNYK_SCAN_MODE || 'dependency' }}
          SNYK_CODE_FALLBACK: ${{ vars.SNYK_CODE_FALLBACK || 'true' }}
          SNYK_ORG: ${{ vars.SNYK_ORG }}
          SNYK_SEVERITY_THRESHOLD: ${{ vars.SNYK_SEVERITY_THRESHOLD }}
          SNYK_DETECTION_DEPTH: ${{ vars.SNYK_DETECTION_DEPTH }}
          CONTEXT_DIR: ${{ inputs.context_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXT_DIR"

          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "SNYK_TOKEN is not configured; skipping Snyk context."
            exit 0
          fi

          if ! command -v npm >/dev/null 2>&1; then
            echo "npm is not available on this runner; skipping Snyk context."
            exit 0
          fi

          if ! command -v snyk >/dev/null 2>&1; then
            npm install -g snyk >/tmp/snyk-install.log 2>&1 || {
              echo "Unable to install Snyk CLI; skipping Snyk context."
              exit 0
            }
          fi

          snyk auth "$SNYK_TOKEN" >/dev/null 2>&1 || true

          scan_path="${SNYK_SCAN_PATH:-.}"
          if [ ! -d "$scan_path" ]; then
            echo "Snyk scan path does not exist: $scan_path; skipping Snyk context."
            exit 0
          fi

          dependency_json="$RUNNER_TEMP/snyk-dependency-test.json"
          dependency_err="$RUNNER_TEMP/snyk-dependency-test.stderr"
          code_json="$RUNNER_TEMP/snyk-code-test.json"
          code_err="$RUNNER_TEMP/snyk-code-test.stderr"
          dependency_status=0
          code_status=0
          ran_dependency=false
          ran_code=false
          mode="$(printf '%s' "${SNYK_SCAN_MODE:-dependency}" | tr '[:upper:]' '[:lower:]')"
          code_fallback="$(printf '%s' "${SNYK_CODE_FALLBACK:-true}" | tr '[:upper:]' '[:lower:]')"

          dependency_args=(test --all-projects --json)
          if [ -n "${SNYK_ORG:-}" ]; then
            dependency_args+=(--org="$SNYK_ORG")
          fi
          if [ -n "${SNYK_SEVERITY_THRESHOLD:-}" ]; then
            dependency_args+=(--severity-threshold="$SNYK_SEVERITY_THRESHOLD")
          fi
          if [ -n "${SNYK_DETECTION_DEPTH:-}" ]; then
            dependency_args+=(--detection-depth="$SNYK_DETECTION_DEPTH")
          fi

          if [ "$mode" = "dependency" ] || [ "$mode" = "dependencies" ] || [ "$mode" = "both" ]; then
            ran_dependency=true
            set +e
            (cd "$scan_path" && snyk "${dependency_args[@]}") >"$dependency_json" 2>"$dependency_err"
            dependency_status=$?
            set -e
          fi

          no_supported_targets=false
          if [ "$ran_dependency" = true ] \
            && [ "$dependency_status" -ne 0 ] \
            && { grep -qi "Could not detect supported target files" "$dependency_json" "$dependency_err" 2>/dev/null; }; then
            no_supported_targets=true
          fi

          if [ "$mode" = "code" ] \
            || [ "$mode" = "snyk-code" ] \
            || [ "$mode" = "both" ] \
            || { [ "$no_supported_targets" = true ] && [ "$code_fallback" != "false" ]; }; then
            ran_code=true
            code_args=(code test --json)
            if [ -n "${SNYK_ORG:-}" ]; then
              code_args+=(--org="$SNYK_ORG")
            fi
            set +e
            (cd "$scan_path" && snyk "${code_args[@]}") >"$code_json" 2>"$code_err"
            code_status=$?
            set -e
          fi

          if [ "$ran_dependency" != true ] && [ "$ran_code" != true ]; then
            echo "Snyk scan mode did not run dependency or code scan; skipping Snyk context."
            exit 0
          fi

          {
            echo "# Snyk vulnerabilities"
            echo
            echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Scan path: $scan_path"
            echo "Scan mode: $mode"
            echo "Dependency scan exit code: $dependency_status"
            echo "Code scan exit code: $code_status"
            echo
            echo "A non-zero Snyk exit code can mean vulnerabilities were found or that Snyk could not scan the selected target."
            if [ "$no_supported_targets" = true ]; then
              echo
              echo "Dependency scan note: Snyk did not detect supported dependency manifest files in the selected scan path."
              echo "If this is unexpected, set SNYK_SCAN_PATH to the folder containing package manifests or project files."
            fi
            if [ "$ran_dependency" = true ]; then
              if [ -s "$dependency_err" ]; then
                echo
                echo "## Dependency scan stderr"
                echo
                echo '```text'
                sed -E 's/(token|authorization|password|secret)[=:][^ ]+/\1=[REDACTED]/Ig' "$dependency_err"
                echo '```'
              fi
              echo
              echo "## Dependency scan JSON result"
              echo
              echo '```json'
              if [ -s "$dependency_json" ]; then
                cat "$dependency_json"
              else
                echo '{"ok": false, "error": "Snyk dependency scan did not return JSON output."}'
              fi
              echo
              echo '```'
            fi
            if [ "$ran_code" = true ]; then
              if [ -s "$code_err" ]; then
                echo
                echo "## Snyk Code stderr"
                echo
                echo '```text'
                sed -E 's/(token|authorization|password|secret)[=:][^ ]+/\1=[REDACTED]/Ig' "$code_err"
                echo '```'
              fi
              echo
              echo "## Snyk Code JSON result"
              echo
              echo '```json'
              if [ -s "$code_json" ]; then
                cat "$code_json"
              else
                echo '{"ok": false, "error": "Snyk Code scan did not return JSON output."}'
              fi
              echo
              echo '```'
            fi
          } > "$CONTEXT_DIR/snyk.md"

      - name: Upload Snyk context
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.context_dir }}/snyk.md
          if-no-files-found: ignore
